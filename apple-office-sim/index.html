<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Apple Office | iPhones con garantía y plan canje</title>
    <meta name="description" content="iPhones nuevos y usados premium en Santiago del Estero. Garantía, plan canje y financiación en cuotas. Cotizá tu equipo online en un minuto." />
    <link rel="canonical" href="https://appleoffice.com.ar/" />

    <!-- Vista previa al compartir el link (WhatsApp, Instagram, etc.).
         Deben estar en el HTML estático: los scrapers no ejecutan JavaScript.
         og:image tiene que ser una URL absoluta. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Apple Office" />
    <meta property="og:url" content="https://appleoffice.com.ar/" />
    <meta property="og:title" content="Apple Office | iPhones con garantía y plan canje" />
    <meta property="og:description" content="Cotizá tu iPhone online: elegí modelo, sumá tu equipo usado y armá tus cuotas. Santiago del Estero." />
    <meta property="og:image" content="https://appleoffice.com.ar/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Apple Office" />
    <meta property="og:locale" content="es_AR" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Imagen del hero: es lo primero que ve el cliente en el celular -->
    <link rel="preload" as="image" href="/hero-poster.jpg" fetchpriority="high" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
